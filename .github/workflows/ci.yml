name: ci
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test
      # must run before cargo: generate_context!() fails if frontendDist (../dist) is missing
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features selftest -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
